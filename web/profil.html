<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EduTrash - Profil</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="levels.js"></script>
</head>

<body>
  <div class="header">
    <h1>🌱 EduTrash</h1>
  </div>

  <div class="container">
    <div class="user-card">
      <div class="avatar" id="avatarInitial">?</div>
      <div>
        <div class="greeting" id="userName" style="font-size: 16px; font-weight: bold; color: white;">Memuat...</div>
        <div class="points-badge">⭐ <span id="pointsValue">0</span> Poin</div>
      </div>
    </div>

    <div class="card">
      <h3 id="levelBadgeTitle">-</h3>
      <div id="progressBar"></div>
    </div>

    <div class="card">
      <h3>Roadmap Badge</h3>
      <div id="levelRoadmap"></div>
    </div>

    <button id="btnLogout"
      style="width:100%; padding:14px; border:none; border-radius:10px; background:#f44336; color:white; font-size:15px; margin-top:8px; cursor:pointer;">Keluar</button>

    <a href="login.html" id="btnMasuk"
      style="display:none; width:100%; box-sizing:border-box; padding:14px; border-radius:10px; background:#2196f3; color:white; font-size:15px; margin-top:8px; text-align:center; text-decoration:none;">Masuk
      / Ganti Akun</a>
  </div>

  <nav class="bottom-nav">
    <a href="beranda.html" class="nav-item"><span class="icon">🏠</span><span>Beranda</span></a>
    <a href="edukasi.html" class="nav-item"><span class="icon">📖</span><span>Edukasi</span></a>
    <a href="scan_sampah.html" class="nav-item nav-fab"><span class="icon">📷</span></a>
    <a href="riwayat.html" class="nav-item"><span class="icon">🕐</span><span>Riwayat</span></a>
    <a href="profil.html" class="nav-item active"><span class="icon">👤</span><span>Profil</span></a>
  </nav>

  <script>
    const keyToUse = typeof SUPABASE_KEY !== "undefined" ? SUPABASE_KEY : SUPABASE_ANON_KEY;
    const supabase = window.supabase.createClient(SUPABASE_URL, keyToUse);

    async function init() {
      // 1. Cek apakah ada user yang login
      const { data: { session } } = await supabase.auth.getSession();

      if (!session) {
        // Kalau nggak ada sesi, lempar balik ke login
        window.location.href = "login.html";
        return;
      }

      const user = session.user;

      // 2. Tarik data dari database tabel profiles
      const { data: profile, error } = await supabase
        .from("profiles")
        .select("full_name, points")
        .eq("id", user.id)
        .single();

      const points = profile ? profile.points : 0;
      const fullName = (profile && profile.full_name) ? profile.full_name : user.email;

      // 3. Tampilkan ke layar
      document.getElementById("userName").textContent = fullName;
      document.getElementById("avatarInitial").textContent = fullName.charAt(0).toUpperCase();
      document.getElementById("pointsValue").textContent = points;

      // Tampilkan Badge
      if (typeof renderLevelBadgeHTML === 'function') {
        document.getElementById("levelBadgeTitle").textContent = renderLevelBadgeHTML(points);
        document.getElementById("progressBar").innerHTML = renderProgressBarHTML(points);
        document.getElementById("levelRoadmap").innerHTML = renderRoadmapHTML(points);
      }
    }

    // Fungsi Log Out
    document.getElementById("btnLogout").addEventListener("click", async () => {
      await supabase.auth.signOut();
      window.location.href = "login.html";
    });

    init();
  </script>
</body>

</html>
