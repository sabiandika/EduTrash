<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EduTrash - Riwayat</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="auth-guard.js"></script>
</head>

<body>
  <div class="header">
    <h1>🌱 EduTrash</h1>
  </div>

  <div class="container">
    <div id="historyList">
      <div class="card">
        <p>Memuat riwayat...</p>
      </div>
    </div>
  </div>

  <nav class="bottom-nav">
    <a href="beranda.html" class="nav-item"><span class="icon">🏠</span><span>Beranda</span></a>
    <a href="edukasi.html" class="nav-item"><span class="icon">📖</span><span>Edukasi</span></a>
    <a href="scan_sampah.html" class="nav-item nav-fab"><span class="icon">📷</span></a>
    <a href="riwayat.html" class="nav-item active"><span class="icon">🕐</span><span>Riwayat</span></a>
    <a href="profil.html" class="nav-item"><span class="icon">👤</span><span>Profil</span></a>
  </nav>

  <script>
    async function init() {
      const user = await authReady;
      if (!user) return; // auth-guard.js udah otomatis redirect ke login.html

      const { data: history, error } = await supabase
        .from("detections")
        .select("prediction, confidence, created_at")
        .eq("user_id", user.id)
        .order("created_at", { ascending: false })
        .limit(50);

      const listEl = document.getElementById("historyList");

      if (error || !history || history.length === 0) {
        listEl.innerHTML = `<div class="card"><p>Belum ada riwayat deteksi. Yuk mulai scan sampah!</p></div>`;
        return;
      }

      listEl.innerHTML = history.map(item => {
        const isOrganik = item.prediction.toLowerCase() === "organik";
        const date = new Date(item.created_at).toLocaleString("id-ID", {
          day: "numeric", month: "short", hour: "2-digit", minute: "2-digit"
        });
        return `
          <div class="card" style="border-left: 4px solid ${isOrganik ? '#4caf50' : '#ff9800'};">
            <h3>${item.prediction} (${item.confidence}%)</h3>
            <p>${date}</p>
          </div>
        `;
      }).join("");
    }

    init();
  </script>
</body>

</html>
